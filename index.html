<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StrikeZone</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="crosshair" aria-hidden="true"></div>
    <div id="aim-controls" aria-hidden="true">
      <svg class="aim-arrow" viewBox="0 0 32 24" aria-hidden="true">
        <path d="M30 12H3M3 12l10-10M3 12l10 10"></path>
      </svg>
      <svg class="aim-arrow" viewBox="0 0 32 24" aria-hidden="true">
        <path d="M2 12h27M29 12L19 2M29 12 19 22"></path>
      </svg>
    </div>
    <div id="hud">
      <h1>StrikeZone</h1>
      <p>Click the lane to look around • W A S D to move • Arrow keys to aim</p>
      <div id="roll-status" aria-live="polite">Ready to roll</div>
      <label id="oil-toggle">
        <input type="checkbox" />
        <span class="toggle-track" aria-hidden="true"><span></span></span>
        <span>Show oil</span>
      </label>
      <label id="pattern-picker">
        <span>Patterns</span>
        <select id="pattern-select" aria-label="Patterns">
          <option value="house-shot">House Shot</option>
        </select>
      </label>
      <details id="ball-settings">
        <summary>Ball settings</summary>
        <div class="ball-setting">
          <label for="ball-speed">Ball Speed <output id="ball-speed-value">18 MPH</output></label>
          <input id="ball-speed" type="range" min="10" max="25" step="1" value="18" />
        </div>
        <div class="ball-setting">
          <label for="rev-rate">Rev Rate <output id="rev-rate-value">300 RPM</output></label>
          <input id="rev-rate" type="range" min="100" max="600" step="10" value="300" />
        </div>
        <div class="ball-setting">
          <label for="axis-rotation">Axis Rotation <output id="axis-rotation-value">45°</output></label>
          <input id="axis-rotation" type="range" min="0" max="90" step="1" value="45" />
        </div>
      </details>
    </div>
    <script type="module" src="/src/script.js"></script>
  </body>
</html>
