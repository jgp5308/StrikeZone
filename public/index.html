<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StrikeZone</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="crosshair" aria-hidden="true"></div>
    <div id="aim-controls" aria-hidden="true">
      <svg class="aim-arrow" viewBox="0 0 32 24" aria-hidden="true">
        <path d="M30 12H3M3 12l10-10M3 12l10 10"></path>
      </svg>
      <svg class="aim-arrow" viewBox="0 0 32 24" aria-hidden="true">
        <path d="M2 12h27M29 12L19 2M29 12 19 22"></path>
      </svg>
    </div>
    <div id="hud">
      <h1>StrikeZone</h1>
      <p>Click the lane to look around • W A S D to move</p>
      <div id="roll-status" aria-live="polite">Ready to roll</div>
      <label id="oil-toggle">
        <input type="checkbox" />
        <span class="toggle-track" aria-hidden="true"><span></span></span>
        <span>Show oil</span>
      </label>
    </div>
    <script type="module" src="/script.js"></script>
  </body>
</html>
